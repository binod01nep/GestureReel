<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GestureReel</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="ambient-glow" aria-hidden="true">
    <div class="glow-orb orb-1"></div>
    <div class="glow-orb orb-2"></div>
    <div class="glow-orb orb-3"></div>
  </div>

  <main class="shell">
    <header class="brand">
      <div class="mark" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="19" x2="12" y2="5"></line>
          <polyline points="5 12 12 5 19 12"></polyline>
        </svg>
      </div>
      <div class="brand-text">
        <h1>GestureReel</h1>
        <p>Natural gesture control</p>
      </div>
    </header>

    <section class="status-panel glass-card">
      <div class="status-info">
        <span class="eyebrow">CURRENT PLATFORM</span>
        <strong id="platform">Checking tab...</strong>
      </div>
      <span id="support" class="pill">Detecting</span>
    </section>

    <section class="control-list glass-card">
      <label class="control-row">
        <div class="control-info">
          <strong>Gesture control</strong>
          <small>✌️ 2x speed / next • ☝️ 1x speed / pause • 👍 like</small>
        </div>
        <input id="gestureEnabled" type="checkbox">
        <span class="toggle"></span>
      </label>
      <label class="control-row">
        <div class="control-info">
          <strong>Auto next</strong>
          <small>Always advance when a reel ends</small>
        </div>
        <input id="autoNext" type="checkbox" checked disabled>
        <span class="toggle"></span>
      </label>
    </section>

    <section class="camera-card glass-card">
      <div class="camera-info">
        <span class="eyebrow">CAMERA</span>
        <strong id="cameraState">Disabled</strong>
        <small id="cameraNote">Processed 100% locally on this device.</small>
      </div>
      <span id="cameraDot" class="camera-dot"></span>
    </section>

    <section class="gesture-card glass-card">
      <div class="gesture-visual">
        <div class="gesture-item"><span>✌️</span><b>Two fingers</b><small>2x speed (video) / next</small></div>
        <div class="gesture-item"><span>☝️</span><b>One finger</b><small>1x speed (video) / play</small></div>
        <div class="gesture-item"><span>👍</span><b>Thumbs up</b><small>like</small></div>
        <div class="gesture-item"><span>👎</span><b>Thumbs down</b><small>dislike</small></div>
      </div>
      <div class="settings">
        <div class="slider-group">
          <div class="slider-header">
            <label for="sensitivity">Sensitivity</label>
            <output id="sensitivityValue">50</output>
          </div>
          <input id="sensitivity" type="range" min="1" max="100" value="50">
        </div>
        <div class="slider-group">
          <div class="slider-header">
            <label for="cooldown">Cooldown</label>
            <output id="cooldownValue">1.2s</output>
          </div>
          <input id="cooldown" type="range" min="400" max="3000" step="100" value="1200">
        </div>
      </div>
    </section>

    <p id="message" class="message" role="status"></p>
  </main>
  <script src="popup.js"></script>
</body>
</html>
