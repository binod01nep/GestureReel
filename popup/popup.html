<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GestureReel</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="shell">
    <header class="brand"><div class="mark" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"></line><polyline points="5 12 12 5 19 12"></polyline></svg></div><div><h1>GestureReel</h1><p>Move through the feed naturally.</p></div></header>
    <section class="status-panel"><div><span class="eyebrow">CURRENT PLATFORM</span><strong id="platform">Checking tab...</strong></div><span id="support" class="pill">Detecting</span></section>
    <section class="control-list">
      <label class="control-row"><span><strong>Gesture control</strong><small>✌️ next/prev • 👍 like • 👎 dislike • ☝️ play/pause</small></span><input id="gestureEnabled" type="checkbox"><span class="toggle"></span></label>
      <label class="control-row"><span><strong>Auto next</strong><small>Always advance when a reel ends</small></span><input id="autoNext" type="checkbox" checked disabled><span class="toggle"></span></label>
    </section>
    <section class="camera-card"><div><span class="eyebrow">CAMERA</span><strong id="cameraState">Disabled</strong><small id="cameraNote">Frames stay on this device.</small></div><span id="cameraDot" class="camera-dot"></span></section>
    <section class="gesture-card"><div class="gesture-visual"><div class="gesture-item"><span>✌️</span><b>Two spread</b><small>next reel</small></div><div class="gesture-item"><span>✌️</span><b>Two joined</b><small>prev reel</small></div><div class="gesture-item"><span>👍</span><b>Thumbs up</b><small>like reel</small></div><div class="gesture-item"><span>👎</span><b>Thumbs down</b><small>dislike / unlike</small></div><div class="gesture-item"><span>☝️</span><b>One finger</b><small>play / pause</small></div></div><div class="settings"><label for="sensitivity">Sensitivity <output id="sensitivityValue">50</output></label><input id="sensitivity" type="range" min="1" max="100" value="50"><label for="cooldown">Cooldown <output id="cooldownValue">1.2s</output></label><input id="cooldown" type="range" min="400" max="3000" step="100" value="1200"></div></section>
    <p id="message" class="message" role="status"></p>
  </main>
  <script src="popup.js"></script>
</body>
</html>
